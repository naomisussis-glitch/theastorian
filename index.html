<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="The Astorian is a literary journal devoted to lasting prose." />
  <title>The Astorian</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f2e8;
      --ink: #121212;
      --muted: rgba(18,18,18,.72);
      --hairline: rgba(18,18,18,.14);
      --card: rgba(255,255,255,.78);
      --max: 980px;
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }

    body{
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "EB Garamond", Garamond, "Times New Roman", Times, serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a{
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--hairline);
    }
    a:hover{ border-bottom-color: var(--muted); }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    header{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 0 22px;
      border-bottom: 1px solid var(--hairline);
      text-align: center;
    }

    .masthead{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo{
      max-width: 280px;
      height: auto;
    }

    .tagline{
      font-size: 13px;
      color: var(--muted);
      font-family: Inter, sans-serif;
    }

    nav{
      display: flex;
      gap: 16px;
      font-size: 15px;
      color: var(--muted);
      font-family: Inter, sans-serif;
    }

    .hero{
      padding: 52px 0 34px;
    }

    .hero h1{
      font-family: "EB Garamond", serif;
      font-size: clamp(36px, 5.2vw, 62px);
      margin-bottom: 14px;
    }

    .lede{
      max-width: 62ch;
      font-size: 19px;
      color: var(--muted);
    }

    .grid{
      margin-top: 22px;
      border-top: 1px solid var(--hairline);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 16px;
      padding: 18px;
      margin-top: 22px;
    }

    .kicker{
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: Inter, sans-serif;
    }

    .card h2{
      font-family: "EB Garamond", serif;
      font-size: 26px;
    }

    .card p{
      font-size: 17px;
      color: var(--muted);
    }

    .label{
      font-size: 13px;
      font-family: Inter, sans-serif;
      color: var(--muted);
    }

    footer{
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--hairline);
      font-size: 13px;
      color: var(--muted);
      font-family: Inter, sans-serif;
    }
  </style>
</head>

<body>
<div class="wrap">

<header>
  <div class="masthead">
    <img src="https://raw.githubusercontent.com/naomisussis-glitch/theastorian/main/G-eJ_SkWkAA_P9J.jpg" class="logo"/>
    <p class="tagline">A journal of lasting prose.</p>
  </div>

  <nav>
    <a href="#latest">Latest</a>
    <a href="about.html">About</a>
    <a href="#submissions">Submissions</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
<section class="hero">
  <h1>A New Literary Journal</h1>
  <p class="lede">
    The Astorian is a new literary journal based in New York City. We seek to publish fiction, essays, and criticism grounded in structure and adherence to classical forms.
  </p>
</section>
</main>

<footer>
  © <span id="year"></span> The Astorian
</footer>

</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
